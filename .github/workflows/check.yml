name: Kit checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels that pull request's run still in progress, since only the newest
# commit's result counts. Runs on main are never cancelled, so every merge keeps its own complete record.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # The core is standard library only: the whole suite with no third-party package installed. The letter
    # reader's and the map tools' tests skip here and run in the reader and verify jobs below.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke
        run: |
          python -m kit prizes
          python -m kit plan PHerc0826 > /dev/null
          python -m kit cost --gpu-hours 6.5 --rate 1.10
      - name: Installed package with no extras, run from outside the clone
        run: |
          python -m pip install .
          cd "$RUNNER_TEMP"
          python -c "import kit, pathlib; assert 'site-packages' in pathlib.Path(kit.__file__).parts, kit.__file__"
          scrolls-workbench prizes > /dev/null
          scrolls-workbench plan PHerc0826 > /dev/null
          # without numpy the demo stops with DEMO ERROR and exit code 2, not a traceback
          set +e; scrolls-letterdemo --quiet; code=$?; set -e
          test "$code" = 2

  reader:
    # The letter reader as users get it, on Linux, macOS and Windows: the package built from this tree and
    # installed with its reader extra (numpy, pillow, tifffile, imagecodecs), the reader's tests, and the
    # offline demo run from outside the clone with the released weights, which it downloads from the GitHub
    # release named in kit/data/letter-weights.json and checks by SHA-256. Not the bash-script tests.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.13']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package with the reader extra
        run: python -m pip install ".[reader]"
      - name: Reader tests
        # These import kit from the checkout (the current folder comes first on sys.path); the demo step below
        # runs the installed copy from outside the clone.
        run: |
          python -m unittest discover -s tests -p "test_letter*.py" -v
          python -m unittest discover -s tests -p "test_greeklm.py" -v
          python -m unittest discover -s tests -p "test_packaging.py" -v
      - name: Demo with the released weights, from outside the clone
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import kit, pathlib; assert 'site-packages' in pathlib.Path(kit.__file__).parts, kit.__file__"
          scrolls-letterdemo --out letterdemo
          scrolls-letterread letterdemo/demo-page.png --weights letters-v2-ccby --letter-px 32 --quiet --no-orientation

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install the package with every extra (the map tools and the reader)
        run: python -m pip install ".[all]"
      - name: Unit tests including kit verify
        run: python -m unittest discover -s tests -v
      - name: Experiment regression tests
        run: |
          python - <<'PYTHON'
          from pathlib import Path
          import subprocess
          import sys

          directories = sorted({p.parent for p in Path("scripts/experiments").rglob("test_*.py")})
          if not directories:
              raise SystemExit("No experiment regression tests found")
          for directory in directories:
              subprocess.run([sys.executable, "-m", "unittest", "discover",
                              "-s", str(directory), "-p", "test_*.py", "-v"], check=True)
          PYTHON
