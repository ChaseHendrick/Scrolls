<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="t d">
<title id="t">windlabel-box relative windings under frozen tests</title>
<desc id="d">Left: windlabel-box's split-chain step accuracy and its one-sided 95 % lower bound in six frozen tests on three scrolls, five passing the 0.92 lower-bound bar and one failing its 70 % keep floor. Right: on the 29 October boxes, windlabel-box against constraint-gauge's E1 on the same steps and against winding-phase at matched coverage; windlabel-box is ahead in every comparable pair, by 0.011 to 0.048.</desc>
